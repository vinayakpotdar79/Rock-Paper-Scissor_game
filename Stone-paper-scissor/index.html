<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor Game</title>
    <link rel="stylesheet" href="style.css" >
</head>
<body>
  <h2>ROCK PAPER AND SCISSOR</h2>
  <div class="hand-img">
    <div class="player1">
        <img src="Rockuser.png" id="userimg">
    </div>
    <div class="player2">
        <img src="Rockcomp.png" id="compimg">
    </div>
  </div>  
  <div class="score">
<div id="uscore"></div>
<div id="compscore"></div>
  </div>
  <input type="text"  placeholder="Enter Number Of Rounds"  id="round" required>
    <button id="done">OK</button>
    <button class="options" id="Rock">Rock</button>
  <button class="options" id="Paper">Paper</button>
  <button class="options" id="Scissor">Scissor</button>
  <script src="script.js"></script>
</body>
</html>
